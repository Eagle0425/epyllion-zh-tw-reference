name: Publish Epyllion reference

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install quality-check dependencies
        run: python -m pip install -r requirements-quality.txt
      - name: Check source, terminology, provenance and generated data
        run: python scripts/quality_check.py --report dist/translation-quality.json
      - name: Test the quality gates
        run: python -m unittest discover -s tests
      - name: Validate content and downloads
        run: node scripts/validate.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
